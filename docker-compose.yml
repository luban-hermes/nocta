services:
  nocta:
    image: ghcr.io/luban-hermes/nocta:latest
    # build: .            # or build locally from source
    container_name: nocta
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/nocta.db
